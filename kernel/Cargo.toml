[package]
name = "kernai"
version = "0.1.0"
edition = "2024"

# Zero dependencies, deliberately: the kernel is core-only. Anything we need
# (frame writer, ring buffer) is small enough to own outright, and the supply
# chain stays empty.
[dependencies]

# Optional: embed C-language payloads (the craycast raycaster). Off by default
# so the standard build + `make test` stay pure Rust with no C toolchain; the
# `make raycast` target turns it on. Enabling it needs clang + lld (rv64) and
# the C payload prebuilt (payloads/build_c.sh, run by the Makefile).
[features]
cpayloads = []

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = true        # keep DWARF for `make debug` / gdb-multiarch

[profile.dev]
panic = "abort"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
